<script type="text/babel" src="../portal/b3-privacy.jsx"></script>
<script type="text/babel" src="../public/b6-discourses.jsx"></script>
<script type="text/babel">
const PAGES={
 about:['About','B4About'],programs:['Programmes','B4Programs'],program:['Eye camps','B4Program'],
 impact:['Impact','PubImpact'],join:['Join a seva','B4Join'],event:['Eye camp, Mayur Vihar','PubEventBefore'],
 'event-after':['Eye camp results','PubEventAfter'],centre:['Sai Centre, Mayur Vihar','PubCentre'],
 district:['East district','B4District'],privacy:['Privacy and data requests','Privacy'],
 discourses:['Discourses','Discourses'],discourse:['Discourse','Reader'],
 calendar:['Calendar','PubCalendarList'],'calendar-v2':['Calendar','PubCalendarList'],'map-v2':['Find a centre','B4CentreMap'],
 'news-v2':['News','B4News'],'article-v2':['Article','B4Article'],
 404:['Page not found','B4Error',{kind:'404'}],500:['Something went wrong','B4Error',{kind:'500'}],moved:['Page moved','B4Error',{kind:'moved'}]
};
function PageApp(){
 const q=new URLSearchParams(location.search),want=window.PAGE_FORCE||q.get('p'),key=PAGES[want]?want:'404';
 const [view,setView]=React.useState('List');
 React.useEffect(()=>{const f=e=>{const b=e.target.closest('.pb-seg button');if(b)setView(/month/i.test(b.textContent)?'Month':'List')};document.addEventListener('click',f);return()=>document.removeEventListener('click',f)},[]);
 const [title,comp,extra]=PAGES[key],l=q.get('l')==='hi'?'hi':'en';
 const [phone,setPhone]=React.useState(innerWidth<700);
 React.useEffect(()=>{const f=()=>setPhone(innerWidth<700);addEventListener('resize',f);return()=>removeEventListener('resize',f)},[]);
 React.useEffect(()=>{document.title=title+' — SSSSO Delhi NCR'},[title]);
 const C=(key==='calendar'||key==='calendar-v2')&&view==='Month'&&!phone?window.PubCalendarMonth:window[comp];
 return <div data-screen-label={title}><C phone={phone} l={l} lang={l} {...(extra||{})}/></div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<PageApp/>);
</script>
