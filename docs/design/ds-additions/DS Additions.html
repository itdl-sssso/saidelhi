<style>
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--surface-page)}
a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}
.bd-wrap{max-width:var(--container-max);margin:0 auto;padding:0 var(--gutter-desktop)}
.bd-hd{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:var(--veil-blur)}
.bd-hd__in{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-top:12px;padding-bottom:12px}
.bd-eyebrow{font-size:var(--text-eyebrow);letter-spacing:var(--tracking-eyebrow);text-transform:uppercase;font-weight:600;color:var(--blue-600)}
.bd-title{font-family:var(--font-serif-display);font-size:18px;color:var(--text-heading)}
.bd-idx{display:flex;gap:2px;flex-wrap:wrap}
.bd-idx a{font-size:var(--text-caption);color:var(--slate-600);text-decoration:none;padding:8px 10px;border-radius:var(--radius-pill);white-space:nowrap}
.bd-idx a:hover{background:var(--pink-100);color:var(--pink-700)}
.bd-intro{padding:56px 0 8px;display:flex;flex-direction:column;gap:14px;max-width:var(--measure-prose)}
.bd-h1{margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:var(--text-h1);line-height:var(--leading-heading);letter-spacing:var(--tracking-display);color:var(--text-heading);text-wrap:pretty}
.bd-sec{padding:64px 0 8px}
.bd-sec__hd{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px;max-width:860px}
.bd-n{font-family:var(--font-serif-display);font-size:var(--text-h3);color:var(--gold-500);line-height:1.2;padding-top:4px}
.bd-h2{margin:0;font-family:var(--font-serif-display);font-weight:400;font-size:var(--text-h2);line-height:var(--leading-heading);color:var(--text-heading)}
.bd-desc{margin:0;font-size:var(--text-body-size);line-height:var(--leading-body);color:var(--slate-600);text-wrap:pretty;max-width:var(--measure-prose)}
.bd-grid{display:grid;gap:16px}
.bd-tile{background:var(--white);border:1px solid var(--border-subtle);border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);min-width:0}
.bd-tile__lbl{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline;padding:12px 20px;border-bottom:1px solid var(--border-subtle);font-size:var(--text-caption);font-weight:600;color:var(--slate-700)}
.bd-code{font-family:var(--font-mono);font-size:12px;background:var(--slate-100);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:2px 6px;color:var(--slate-700);white-space:nowrap}
.bd-list{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:8px;font-size:var(--text-small);line-height:1.55;color:var(--slate-700)}
.bd-list b{font-weight:600;color:var(--slate-900)}
.bd-type{display:grid;grid-template-columns:170px minmax(0,1fr) minmax(0,1fr) 130px;gap:24px;align-items:baseline;padding:16px 20px;border-bottom:1px solid var(--border-subtle)}
.bd-type:last-child{border-bottom:0}
.bd-type--hd{font-size:var(--text-caption);font-weight:600;color:var(--slate-600);background:var(--sand);padding-top:10px;padding-bottom:10px}
.bd-pilltbl{display:grid;grid-template-columns:max-content max-content;gap:10px 16px;align-items:center}
.bd-builder{display:grid;grid-template-columns:220px minmax(0,1fr) minmax(300px,380px);gap:16px;padding:16px;align-items:start}
@media (max-width:1000px){.bd-builder{grid-template-columns:1fr}.bd-type{grid-template-columns:1fr;gap:6px}.bd-type--hd{display:none}}
@media (max-width:720px){.bd-wrap{padding:0 var(--gutter-mobile)}.bd-grid>*{grid-column:auto!important}.bd-sec{padding-top:48px}.bd-h1{font-size:var(--text-h2)}.bd-idx{display:none}}
</style>
</head>
