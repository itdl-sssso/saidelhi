# /etc/nginx/sites-available/saidelhi-staging  (symlink into sites-enabled)
# HTTP only as written; `certbot --nginx -d staging.saidelhi.org -d api.staging.saidelhi.org`
# then adds the 443 listeners, certificates and the http→https redirect.
# Both hosts proxy to the one Next.js server on 127.0.0.1:3000.

upstream saidelhi_app {
    server 127.0.0.1:3000;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Site + portal + form links. The portal calls its own /api/v1 (sid/csrf cookies are host-only).
server {
    listen 80;
    listen [::]:80;
    server_name staging.saidelhi.org;

    client_max_body_size 12m;   # largest upload: sitemap 10 MB (UPLOAD_LIMITS)

    # Staging must not be indexed.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Optional gate for the whole site (leave /f/ and /api/ open for testers and webhooks):
    # auth_basic "Staging";
    # auth_basic_user_file /etc/nginx/saidelhi-staging.htpasswd;   # htpasswd -c <file> <user>

    # Jobs are triggered from the host crontab over loopback only.
    location /api/v1/cron/ { return 404; }

    location / {
        proxy_pass http://saidelhi_app;
        include /etc/nginx/snippets/saidelhi-proxy.conf;
    }
}

# API host: https://api.staging.saidelhi.org/<path> → /api/v1/<path> (e.g. /whatsapp/webhook).
server {
    listen 80;
    listen [::]:80;
    server_name api.staging.saidelhi.org;

    client_max_body_size 12m;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location /cron/        { return 404; }
    location /api/v1/cron/ { return 404; }

    # Already-prefixed paths pass through unchanged.
    location /api/v1/ {
        proxy_pass http://saidelhi_app;
        include /etc/nginx/snippets/saidelhi-proxy.conf;
    }

    location / {
        proxy_pass http://saidelhi_app/api/v1/;
        include /etc/nginx/snippets/saidelhi-proxy.conf;
    }
}
