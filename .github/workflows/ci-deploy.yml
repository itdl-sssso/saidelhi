name: CI / deploy staging

# PRs into main: checks only. Push to main (a merged PR): checks, then deploy that commit to staging.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # DB-backed tests need the legacy schema + migrations + fixtures (same as local `pnpm db:reset`, minus the legacy dump).
      - name: Env + MySQL
        run: |
          sed -e 's/^DATA_SOURCE=.*/DATA_SOURCE=db/' .env.example > .env.local
          pnpm db:up
          pnpm db:migrate
          pnpm db:seed > /dev/null

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test

  deploy:
    needs: checks
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: staging
      url: https://staging.saidelhi.org
    # One deploy at a time; a newer main commit waits, then the server skips stale SHAs.
    concurrency:
      group: deploy-staging
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          # The key is bound to a forced command on the server that only deploys a main commit by SHA.
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes -o BatchMode=yes -o ServerAliveInterval=30 \
            "ubuntu@$HOST" "$GITHUB_SHA"

      - name: Smoke test
        run: |
          for p in / /hi /news /admin/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --retry-delay 5 "https://staging.saidelhi.org$p")
            echo "$p $code"; [ "$code" = 200 ] || exit 1
          done
