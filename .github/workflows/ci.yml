name: CI

# Every PR into main and every push to main. CD (cd.yml) deploys a main commit only after this passes.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4 # version from package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Known vulnerabilities in production dependencies, high and critical only (registry advisories; no dependency graph needed).
      - run: pnpm audit --prod --audit-level high

      # DB-backed tests need the legacy schema + migrations + fixtures (same as local `pnpm db:reset`, minus the legacy dump).
      - name: Env + MySQL
        run: |
          sed -e 's/^DATA_SOURCE=.*/DATA_SOURCE=db/' .env.example > .env.local
          pnpm db:up
          pnpm db:migrate
          pnpm db:seed > /dev/null

      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build

  secrets:
    name: Secrets and repo rules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks scans every commit, not just the tip
      # Project rules: no env files, dumps, keys or public server IPs in this public repo.
      - run: scripts/ci/repo-guard.sh
      # gitleaks CLI (the gitleaks GitHub action needs a paid licence for org repos).
      - name: gitleaks
        run: |
          range=""
          if [ "${{ github.event_name }}" = pull_request ]; then
            range="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          fi
          docker run --rm -v "$PWD:/repo" -w /repo ghcr.io/gitleaks/gitleaks:v8.24.0 \
            git --no-banner --redact --verbose ${range:+--log-opts="$range"} /repo

  # Disabled: dependency review needs the repo's dependency graph, which only an org admin can
  # enable. Re-enable (delete the `if: false`) once it is on, and add it to the required checks.
  dependency-review:
    name: Dependency review
    if: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # New or upgraded dependencies in this PR: block high-severity advisories.
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
